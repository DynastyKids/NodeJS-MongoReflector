name: Advanced Node.js Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    name: Lint & Test

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js LTS
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Check code syntax
      run: node -c server.js

    - name: Verify dependencies are installed
      run: npm ls

  test-multiple-versions:
    runs-on: ubuntu-latest
    name: Test Node.js ${{ matrix.node-version }}

    strategy:
      matrix:
        node-version: [14.x, 16.x, 18.x, 20.x]
      fail-fast: false

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Start server and run smoke tests
      run: |
        npm start > /tmp/server.log 2>&1 &
        SERVER_PID=$!
        
        # Wait for server to be ready
        echo "Waiting for server to start..."
        for i in {1..30}; do
          if curl -s http://localhost:3000/ > /dev/null 2>&1; then
            echo "Server is ready!"
            break
          fi
          echo "Attempt $i/30..."
          sleep 1
        done
        
        # Run the test suite
        npm test
        
        # Kill the server
        kill $SERVER_PID 2>/dev/null || true

    - name: Upload server logs on failure
      if: failure()
      uses: actions/upload-artifact@v3
      with:
        name: server-logs-${{ matrix.node-version }}
        path: /tmp/server.log

  security-check:
    runs-on: ubuntu-latest
    name: Security & Dependencies Check

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js LTS
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Check for vulnerabilities
      run: npm audit --audit-level=moderate
      continue-on-error: true

    - name: Check for outdated packages
      run: npm outdated
      continue-on-error: true

  integration-test:
    runs-on: ubuntu-latest
    name: Integration Tests

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js LTS
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Test server startup on different ports
      run: |
        echo "Testing server startup on port 3000..."
        PORT=3000 timeout 3 npm start > /tmp/server-3000.log 2>&1 &
        sleep 2
        curl -s http://localhost:3000/ > /dev/null && echo "✓ Port 3000 OK" || echo "✗ Port 3000 failed"
        
        echo "Testing server startup on port 8080..."
        PORT=8080 timeout 3 npm start > /tmp/server-8080.log 2>&1 &
        sleep 2
        curl -s http://localhost:8080/ > /dev/null && echo "✓ Port 8080 OK" || echo "✗ Port 8080 failed"

    - name: Verify Swagger files
      run: |
        echo "Checking api/swagger.json..."
        node -e "JSON.parse(require('fs').readFileSync('./api/swagger.json', 'utf8'))" && echo "✓ api/swagger.json is valid JSON" || echo "✗ api/swagger.json is invalid"
        
        echo "Checking api/swagger.zh_cn.json..."
        node -e "JSON.parse(require('fs').readFileSync('./api/swagger.zh_cn.json', 'utf8'))" && echo "✓ api/swagger.zh_cn.json is valid JSON" || echo "✗ api/swagger.zh_cn.json is invalid"

  build-summary:
    runs-on: ubuntu-latest
    name: Build Summary
    needs: [lint-and-test, test-multiple-versions, security-check, integration-test]
    if: always()

    steps:
    - name: Generate build summary
      run: |
        echo "# MongoDB Reflector CI/CD Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Test Results" >> $GITHUB_STEP_SUMMARY
        echo "- **Lint & Syntax Check**: ${{ needs.lint-and-test.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Multi-Version Testing**: ${{ needs.test-multiple-versions.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Security Check**: ${{ needs.security-check.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Integration Tests**: ${{ needs.integration-test.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Build Status" >> $GITHUB_STEP_SUMMARY
        if [[ "${{ needs.lint-and-test.result }}" == "success" && "${{ needs.test-multiple-versions.result }}" == "success" ]]; then
          echo "✅ **Build PASSED**" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Build FAILED**" >> $GITHUB_STEP_SUMMARY
        fi
